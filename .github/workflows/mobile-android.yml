name: Mobile - Android

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      rust: ${{ steps.ver.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"
          echo "rust=$(packaging/version.sh --rust)" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and Platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.version.outputs.rust }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Build Rust cdylib + debug APK
        run: packaging/scripts/build-android.sh

      - name: Assemble Play bundle when release secrets exist
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "No ANDROID_KEYSTORE secret; skipping signed bundle."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/apa-kan-release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE"
          (cd android && ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon)

      - name: Package Android artifacts
        run: packaging/scripts/package-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apa-kan-${{ env.VERSION }}-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: apa-kan-*-android
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.{apk,aab} --clobber
