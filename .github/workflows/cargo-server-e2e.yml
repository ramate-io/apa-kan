name: Server E2E

on:
  push:
    branches:

jobs:
  server-e2e:
    uses: ./.github/workflows/nix-command.yml
    with:
      command: cargo test -p apa-kan-server --test e2e_accounts --test e2e_games -- --test-threads=1
      nix_flake_path: '.'
      runner: 'ubuntu-latest'
      rust_cache_key: cargo-server-e2e