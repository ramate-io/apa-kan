name: Mobile - iOS

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mobile-ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: write

jobs:
  version:
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'ci-action::package')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      rust: ${{ steps.ver.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"
          echo "rust=$(packaging/version.sh --rust)" >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.version.outputs.rust }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      
      - name: Build iOS binary
        run: cargo build -p apa-kan --release --target aarch64-apple-ios
      
      - name: Package iOS app bundle
        run: packaging/scripts/package-ios.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: apa-kan-${{ env.VERSION }}-ios
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release'
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: apa-kan-*-ios
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.ipa --clobber
