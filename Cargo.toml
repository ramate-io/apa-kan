[workspace]

resolver = "2"

members = [
  "apa-kan/account",
  "apa-kan/game",
  "apa-kan/server",
  "apa-kan/store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LICENSE.md" 
authors = ["Ramate LLC"]
repository = "https://github.com/ramate-io/apa-kan"
homepage = "https://github.com/ramate-io/apa-kan"
publish = false
rust-version = "1.95.0"

[workspace.dependencies]
apa-kan-account = { path = "apa-kan/account" }
apa-kan-store = { path = "apa-kan/store" }
async-trait = "0.1"
axum = "0.8"
bevy = { version = "0.19.1" }
hex = "0.4"
# OPEN-Q #58-19: joint bump with gwrdfa vs crates.io 0.1.2 — pinned to gwrdfa for now.
ml-dsa = { version = "=0.1.0-rc.7", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10.8"
sqlx = { version = "0.8", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
inefficient_to_string = "deny"
map_flatten = "deny"
manual_ok_or = "deny"
doc_link_with_quotes = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
panic = "unwind"

[profile.release.build-override]
opt-level = 3
strip = false

[profile.perf]
inherits = "release"
codegen-units = 1
lto = "thin"
