[workspace]

resolver = "2"

members = [
  "apa-kan/game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LICENSE.md" 
authors = ["Ramate LLC"]
repository = "https://github.com/ramate-io/apa-kan"
homepage = "https://github.com/ramate-io/apa-kan"
publish = false
rust-version = "1.95.0"

[workspace.dependencies]
bevy = { version = "0.19.1" }

[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"
inefficient_to_string = "deny"
map_flatten = "deny"
manual_ok_or = "deny"
doc_link_with_quotes = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
panic = "unwind"

[profile.release.build-override]
opt-level = 3
strip = false

[profile.perf]
inherits = "release"
codegen-units = 1
lto = "thin"
