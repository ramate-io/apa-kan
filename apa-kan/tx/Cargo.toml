[package]
name = "apa-kan-tx"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }
description = "Apa Kan signed transaction envelope (ML-DSA, account keys) and the deterministic state machine that folds a ledger stream into state. No Bevy, no HTTP, no storage."

[lib]
name = "apa_kan_tx"
path = "src/lib.rs"

[dependencies]
apa-kan-account = { workspace = true }
apa-kan-core = { workspace = true }
apa-kan-view = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
hex.workspace = true
ml-dsa.workspace = true
# UDP preview sealing (see `preview`).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }

[lints]
workspace = true
