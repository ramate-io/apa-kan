[package]
name = "apa-kan-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }
default-run = "apa-kan-server"

[[bin]]
name = "apa-kan-server"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["apa-kan-store/sqlite", "apa-kan-ledger/sqlite"]
# Ledger in Postgres (`APAKAN_LEDGER_URL=postgres://…`).
postgres = ["apa-kan-ledger/postgres"]

[dependencies]
apa-kan-account = { workspace = true }
apa-kan-core = { workspace = true }
apa-kan-ledger = { workspace = true }
apa-kan-store = { workspace = true, features = ["sqlite"] }
apa-kan-tx = { workspace = true }
apa-kan-view = { workspace = true }
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
apa-kan-ledger = { workspace = true, features = ["sqlite"] }
apa-kan-account = { workspace = true }
apa-kan-view = { workspace = true }
ml-dsa.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time", "process"] }

[lints]
workspace = true