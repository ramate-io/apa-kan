# Search-tree base (`--search-profile enhanced`). Live default is `exactplay`
# (this tree plus eval_margin_scale 200).
# LMR + PVS + quiescence on; MCTS progressive widening off.
name = "enhanced"
description = "Search tree without the exactplay leaf-margin scale"
move_ordering = true
transposition = true
tt_bits = 18
lmr = true
pvs = true
quiescence = true
mcts_progressive_widening = false
mcts_heuristic_playouts = true
mcts_root_threads = 1
puct = 1.6
playout_cutoff = 12
