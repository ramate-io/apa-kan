[package]
name = "apa-kan"
version = { workspace = true }
edition  = { workspace = true }
license  = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }
default-run = "apa-kan"

[lib]
name = "apa_kan"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:webbrowser"]

[[bin]]
name = "apa-kan"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "apa-kan-bench"
path = "src/bin/bench.rs"

[dependencies]
apa-kan-core = { path = "../core" }
bevy = { workspace = true, optional = true, features = ["android-game-activity"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
webbrowser = { version = "1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
apa-kan-core = { path = "../core", features = ["test-helpers"] }

[lints]
workspace = true

# Android packaging lives in `android/` (Gradle + GameActivity). cargo-apk
# metadata is intentionally gone: App Links autoVerify, Play App Bundles, and
# release signing need a real Android Gradle project. Application id is
# `io.ramate.apakan` (no underscore) so iOS can match.
