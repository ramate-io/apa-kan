[versions]
agp = "8.8.2"
kotlin = "2.1.10"
appcompat = "1.7.1"
core = "1.15.0"
coreKtx = "1.15.0"
# Must match android-activity 0.6.1 (Bevy 0.19.1). Do not bump past 4.4.0
# without checking android-activity release notes.
gamesActivity = "4.4.0"
splashscreen = "1.0.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
games-activity = { group = "androidx.games", name = "games-activity", version.ref = "gamesActivity" }
splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
