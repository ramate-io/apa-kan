name: ApaKan
options:
  bundleIdPrefix: io.ramate
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.ramate.apakan
    PRODUCT_NAME: ApaKan
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: false
    CLANG_ENABLE_MODULES: true
    # Simulator / CI: unsigned. Device signing is documented in README.md.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: false
    CODE_SIGNING_ALLOWED: false
    DEVELOPMENT_TEAM: ""
targets:
  ApaKan:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ramate.apakan
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: ApaKan
    postBuildScripts:
      - name: Replace executable with Rust/Bevy binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${PROJECT_DIR}/scripts/build-rust.sh"
schemes:
  ApaKan:
    build:
      targets:
        ApaKan: all
    run:
      config: Debug
      commandLineArguments: {}
