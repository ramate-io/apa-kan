server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Deep-link paths (`/game/<id>`, `/h2h`) fall back to the host page.
	# Hash routes (`#/game/<id>`) do not need a rewrite.
	location / {
		try_files $uri $uri/ /index.html;
	}

	location ~* \.(wasm|js|css|png|toml)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=3600";
	}

	# Time-sliced search does not need SharedArrayBuffer / COOP+COEP.
	add_header Cross-Origin-Resource-Policy same-origin;
}
